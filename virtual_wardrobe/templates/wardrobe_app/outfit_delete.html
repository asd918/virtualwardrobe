{% extends 'base.html' %}

{% block title %}Delete Outfit{% endblock %}

{% block content %}
    <h1>Delete Outfit</h1>
    
    <p>Are you sure you want to delete "{{ outfit.name }}"?</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'wardrobe:outfit_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
